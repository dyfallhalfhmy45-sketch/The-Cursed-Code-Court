<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محكمة الأكواد الملعونة · The Cursed Code Court</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4ecdc;--card:#fffaf0;--tx:#2a1a14;--mut:#7a6455;--acc:#9c1c1c;--gold:#9a7412;--ok:#1b7a3d;--line:#dccfb5;--code:#efe5cf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12090d;--card:#1d1015;--tx:#f1e6d6;--mut:#a68f80;--acc:#ff5a4d;--gold:#e0b04a;--ok:#4ade80;--line:#3a2229;--code:#0c0609}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12090d;--card:#1d1015;--tx:#f1e6d6;--mut:#a68f80;--acc:#ff5a4d;--gold:#e0b04a;--ok:#4ade80;--line:#3a2229;--code:#0c0609}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 Cairo,system-ui,"Segoe UI",Tahoma,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:clamp(26px,6vw,44px);margin:18px 0 4px;font-weight:900;color:var(--acc);line-height:1.2}
.sub{color:var(--mut);margin:0 0 22px}
.tog{background:none;border:1px solid var(--line);color:var(--tx);padding:6px 14px;border-radius:99px;cursor:pointer;font:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:16px 0}
.card h2{margin:0 0 8px;font-size:18px;color:var(--gold)}
label{display:block;font-weight:700;margin:10px 0 6px}
select,textarea,input{width:100%;background:var(--code);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:14px/1.5 ui-monospace,Consolas,monospace}
textarea{min-height:170px;resize:vertical;direction:ltr;text-align:left}
select,input{font-family:inherit;font-size:15px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 22px;font:700 16px Cairo,sans-serif;cursor:pointer;margin-top:12px}
.btn:disabled{opacity:.5;cursor:wait}
.btn.ghost{background:none;color:var(--mut);border:1px solid var(--line)}
pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;direction:ltr;text-align:left;margin:8px 0;font:13.5px/1.55 ui-monospace,Consolas,monospace;white-space:pre}
ul{margin:6px 0;padding-inline-start:22px}
.verdict{font-size:18px;font-weight:700}
.lock{text-align:center;color:var(--mut);padding:26px 10px;border:2px dashed var(--line);border-radius:12px}
.lock b{font-size:34px;display:block}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--acc);font-weight:700}
.hide{display:none}
footer{text-align:center;color:var(--mut);font-size:13px;margin-top:30px}
.api-box{margin-bottom:15px;background:var(--code);padding:12px;border-radius:10px;border:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
<header><span style="font-size:34px">⚖️</span><button class="tog" id="tg">English</button></header>
<h1 data-i="title"></h1>
<p class="sub" data-i="sub"></p>

<section class="card">
<div class="api-box">
<label for="apikey" data-i="api_label">مفتاح Gemini API:</label>
<input type="password" id="apikey" placeholder="أدخل مفتاح الـ API هنا (AIzaSy...)">
</div>
</section>

<section class="card" id="in">
<h2 data-i="h_def"></h2>
<label for="lg" data-i="lang"></label>
<select id="lg"><option>Python</option><option>JavaScript</option><option>Java</option><option>C++</option><option>C#</option><option>PHP</option><option>Go</option><option>Rust</option><option>TypeScript</option><option>SQL</option><option>Other</option></select>
<label for="code" data-i="code"></label>
<textarea id="code" spellcheck="false" data-p="ph"></textarea>
<button class="btn" id="go" data-i="go"></button>
<p id="err" class="bad hide"></p>
</section>

<div id="out" class="hide">
<section class="card"><h2 data-i="h_v"></h2><p class="verdict" id="vd"></p><ul id="ch"></ul><p id="sn" style="color:var(--gold);font-weight:700"></p></section>

<section class="card" id="pen">
<h2 data-i="h_p"></h2>
<p id="pt"></p>
<textarea id="pc" spellcheck="false" data-p="ph2" style="min-height:110px"></textarea>
<button class="btn" id="pb" data-i="pay"></button>
<p id="pr" class="hide"></p>
</section>

<section class="card">
<h2 data-i="h_s"></h2>
<div class="lock" id="lk"><b>🔒</b><span data-i="locked"></span></div>
<div id="sol" class="hide"><p class="ok" data-i="free"></p><pre id="fx"></pre><p id="ex"></p></div>
</section>
<button class="btn ghost" id="nw" data-i="again"></button>
</div>

<footer data-i="foot"></footer>
</div>

<script>
const T={
ar:{title:"محكمة الأكواد الملعونة",sub:"الصق كودك المكسور… واستعد للمحاكمة. الحكم النهائي لا يُفتح إلا بعد أداء العقوبة.",h_def:"المتهم",lang:"لغة البرمجة",code:"الكود المتهم",ph:"الصق الكود المليء بالأخطاء هنا…",go:"استدعِ القاضي",h_v:"حكم المحكمة",h_p:"العقوبة البرمجية",ph2:"اكتب كود العقوبة هنا…",pay:"أنفّذ العقوبة",h_s:"الحل الصحيح",locked:"الحل مقفل حتى تنفّذ العقوبة.",free:"تم العفو عنك. هذا هو الحل:",again:"قضية جديدة",foot:"محكمة الأكواد الملعونة · يُحاكَم الكود وليس صاحبه 😉",judging:"القاضي يراجع القضية…",verifying:"القاضي يفحص عقوبتك…",empty:"الصق الكود أولاً.",nofey:"الرجاء إدخال مفتاح Gemini API أولاً.",fail:"تعذّر الاتصال بالقاضي. حاول مرة أخرى.",lang_out:"Arabic",charges:"التهم",api_label:"مفتاح Google Gemini API:"},
en:{title:"The Cursed Code Court",sub:"Paste your broken code… and brace for trial. The final fix stays locked until you serve your penance.",h_def:"The Defendant",lang:"Programming language",code:"The accused code",ph:"Paste your buggy code here…",go:"Summon the Judge",h_v:"The Verdict",h_p:"Your Penance",ph2:"Write your penance code here…",pay:"Serve the penance",h_s:"The Correct Fix",locked:"The fix is locked until you serve your penance.",free:"You are pardoned. Here is the fix:",again:"New case",foot:"The Cursed Code Court · the code is on trial, not you 😉",judging:"The judge is reviewing the case…",verifying:"The judge is inspecting your penance…",empty:"Paste some code first.",nofey:"Please enter your Gemini API key first.",fail:"Couldn’t reach the judge. Try again.",lang_out:"English",charges:"Charges",api_label:"Google Gemini API Key:"}
};
let L=(navigator.language||"").startsWith("ar")?"ar":"en",C=null;
const $=i=>document.getElementById(i);
function setLang(l){L=l;const d=document.documentElement;d.lang=l;d.dir=l=="ar"?"rtl":"ltr";
document.querySelectorAll("[data-i]").forEach(e=>e.textContent=T[l][e.dataset.i]);
document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=T[l][e.dataset.p]);
$("tg").textContent=l=="ar"?"English":"العربية"}
$("tg").onclick=()=>setLang(L=="ar"?"en":"ar");

async function ask(p){
    const key = $("apikey").value.trim();
    if(!key) throw {code: "nofey"};
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ parts: [{ text: p }] }] })
    });
    const data = await res.json();
    if (data.candidates && data.candidates[0].content) {
        return data.candidates[0].content.parts[0].text;
    } else {
        throw new Error("API Error");
    }
}

function parse(t){
    const m = t.match(/\{[\s\S]*\}/);
    if(!m) throw new Error("Invalid JSON");
    return JSON.parse(m[0]);
}

function err(m){const e=$("err");e.textContent=m;e.classList.toggle("hide",!m)}

$("go").onclick=async()=>{
    const code=$("code").value.trim();err("");
    if(!code){err(T[L].empty);return}
    const b=$("go");b.disabled=true;b.textContent=T[L].judging;
    const p=`You are "The Cursed Code Judge": a ruthless, theatrical, sarcastic cyber-judge presiding over a courtroom for bad code. Write every text field in ${T[L].lang_out}. Roast the CODE, never the person. The code language is ${$("lg").value}.
Code:
${code}

Return ONLY a JSON object (no markdown fences or extra text) with keys:
"verdict": 2-4 savage but witty sentences mocking the code,
"charges": array of short strings, one per real bug or bad practice found,
"sentence": one dramatic sentence of ruling,
"penance": a small concrete coding task (2-5 lines of code, any language) themed on the defendant's sin, e.g. print a confession sentence 10 times,
"fixed_code": the full corrected code,
"explanation": a short explanation of what was fixed.`;
    try{
     C=parse(await ask(p));
     $("vd").textContent=C.verdict;$("sn").textContent=C.sentence;
     const ul=$("ch");ul.textContent="";(C.charges||[]).forEach(c=>{const li=document.createElement("li");li.textContent=c;ul.appendChild(li)});
     $("pt").textContent=C.penance;$("pc").value="";$("pr").classList.add("hide");
     $("lk").classList.remove("hide");$("sol").classList.add("hide");
     $("fx").textContent="";$("ex").textContent="";
     $("out").classList.remove("hide");$("out").scrollIntoView({behavior:"smooth"});
    }catch(e){err(e&&e.code=="nofey"?T[L].nofey:T[L].fail)}
    b.disabled=false;b.textContent=T[L].go;
};

$("pb").onclick=async()=>{
    const sub=$("pc").value.trim();if(!sub||!C)return;
    const b=$("pb"),r=$("pr");b.disabled=true;b.textContent=T[L].verifying;
    const p=`You are a strict but fair, sarcastic code judge. Penance task: "${C.penance}"
Submitted code:
${sub}

Decide whether the submitted code correctly does what the task asks (any language is fine, judge syntax and logic). Return ONLY JSON, no markdown fences: {"ok": true or false, "comment": "one short sarcastic sentence in ${T[L].lang_out}"}`;
    try{
     const v=parse(await ask(p));
     r.textContent=v.comment;r.className=v.ok?"ok":"bad";
     if(v.ok){$("fx").textContent=C.fixed_code;$("ex").textContent=C.explanation;
      $("lk").classList.add("hide");$("sol").classList.remove("hide")}
    }catch(e){r.textContent=T[L].fail;r.className="bad"}
    b.disabled=false;b.textContent=T[L].pay;
};

$("nw").onclick=()=>{C=null;$("out").classList.add("hide");$("code").value="";window.scrollTo({top:0,behavior:"smooth"})};
setLang(L);
</script>
</body>
</html>
